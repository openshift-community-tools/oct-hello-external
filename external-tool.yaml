apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-hello-external
spec:
  displayName: Hello External
  description: >-
    Example external OCT module. This was added via the "Add external extension"
    button, not from the community catalog.
  category: management
  source: external
  git: https://github.com/openshift-community-tools/oct-hello-external
  consolePlugin: oct-hello-external
  href: /community-tools/management/hello-external
  defaultChannel: stable
  # Optional: what the tool needs, and why (oct-storefront docs/security-model.md).
  # The storefront shows it on the install review screen and compares it with what
  # the manifests really do; it never relaxes a check. Without it the tile shows
  # "Not declared".
  security:
    schema: 1
    level: plugin
    summary: Console page only. No backend, no API access, no RBAC.
    contact: https://github.com/openshift-community-tools/oct-hello-external/security/advisories
    network:
      ingress: console-only
    secrets:
      access: none
  versions:
    - version: "1.0.0"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/openshift-community-tools/oct-hello-external:1.0.0-ocp4.21
    - version: "1.0.0"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/openshift-community-tools/oct-hello-external:1.0.0-ocp4.22
